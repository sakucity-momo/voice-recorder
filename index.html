    <!-- PWAマニフェストをインラインBlobで自動生成 -->
    <script>
      (function() {
        // アイコンをCanvasで動的に生成 (PNG形式)
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        
        // 背景を描画 (白)
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(256, 256, 256, 0, Math.PI * 2);
        ctx.fill();
        
        // 白背景だと境界が分かりにくいため、黒い縁取りを追加
        ctx.lineWidth = 12;
        ctx.strokeStyle = '#000000';
        ctx.stroke();
        
        // マイクのアイコンを描画 (黒)
        // 元のSVGが100x100のviewBoxなので、512x512に合わせて5.12倍にスケール
        ctx.scale(5.12, 5.12);
        ctx.fillStyle = '#000000';
        const micPath = new Path2D('M50 24a12 12 0 0 0-12 12v16a12 12 0 0 0 24 0V36a12 12 0 0 0-12-12zm18 28c0 9.94-8.06 18-18 18s-18-8.06-18-18h-4c0 11.25 8.44 20.55 19 21.83V80h6v-6.17C63.56 72.55 72 63.25 72 52h-4z');
        ctx.fill(micPath);
        
        const iconDataUrl = canvas.toDataURL('image/png');
        window.generatedAppIconUrl = iconDataUrl; // 画面プレビュー用に保存

        const manifest = {
          name: "ボイスレコーダー",
          short_name: "録音",
          start_url: "./index.html",
          display: "standalone",
          background_color: "#11151c",
          theme_color: "#11151c",
          icons: [
            {
              src: iconDataUrl,
              sizes: "512x512",
              type: "image/png",
              purpose: "any maskable"
            }
          ]
        };
        const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
      })();
    </script>

    <style>
        /* テーマ定義およびメインのカスタムCSS */
        :root {
            --bg-main: #11151c; --bg-panel: #1a212d; --text-main: #ffffff;
            --text-muted: #9ca3af; --accent: #3b82f6; --accent-hover: #2563eb; --border-color: rgba(255, 255, 255, 0.1);
        }
        [data-theme="white"] {
            --bg-main: #f9fafb; --bg-panel: #ffffff; --text-main: #111827;
            --text-muted: #6b7280; --accent: #3b82f6; --accent-hover: #2563eb; --border-color: rgba(0, 0, 0, 0.1);
        }
        [data-theme="pink"] {
            --bg-main: #fdf2f8; --bg-panel: #fce7f3; --text-main: #831843;
            --text-muted: #be185d; --accent: #ec4899; --accent-hover: #db2777; --border-color: rgba(131, 24, 67, 0.1);
        }
        [data-theme="orange"] {
            --bg-main: #fff7ed; --bg-panel: #ffedd5; --text-main: #7c2d12;
            --text-muted: #c2410c; --accent: #f97316; --accent-hover: #ea580c; --border-color: rgba(124, 45, 18, 0.1);
        }
        [data-theme="green"] {
            --bg-main: #f0fdf4; --bg-panel: #dcfce7; --text-main: #14532d;
            --text-muted: #15803d; --accent: #22c55e; --accent-hover: #16a34a; --border-color: rgba(20, 83, 45, 0.1);
        }
        [data-theme="blue"] {
            --bg-main: #eff6ff; --bg-panel: #dbeafe; --text-main: #1e3a8a;
            --text-muted: #1d4ed8; --accent: #3b82f6; --accent-hover: #2563eb; --border-color: rgba(30, 58, 138, 0.1);
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-main); color: var(--text-main);
            transition: background-color 0.4s ease, color 0.4s ease;
            user-select: none; -webkit-user-select: none; cursor: default;
        }
        input { user-select: auto; -webkit-user-select: auto; }
        input[type=range] { cursor: pointer; }

        .border-theme { border-color: var(--border-color); }
        .bg-theme-panel { background-color: var(--bg-panel); transition: background-color 0.4s ease; }
        .text-theme-muted { color: var(--text-muted); }
        .bg-theme-accent { background-color: var(--accent); }
        .text-theme-accent { color: var(--accent); }
        .text-main { color: var(--text-main); }
        .focus\:border-theme-accent:focus { border-color: var(--accent); }

        .filename-input {
            background: transparent; border: none; border-bottom: 2px solid transparent;
            outline: none; color: var(--text-main); font-size: 1.5rem;
            transition: border-color 0.2s; pointer-events: auto;
        }
        .filename-input:focus { border-bottom: 2px solid var(--accent); }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%;
            background: var(--accent); cursor: pointer; margin-top: -4px; box-shadow: 0 0 0 2px var(--bg-panel);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: var(--border-color); border-radius: 2px;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .recording-item:hover { background-color: var(--border-color); }
        .recording-item.active { background-color: var(--border-color); border-left: 3px solid var(--accent); }

        .search-input {
            width: 0; opacity: 0; pointer-events: none;
            transition: width 0.3s ease, opacity 0.3s ease;
            background: var(--bg-panel); color: var(--text-main);
            border-radius: 9999px; padding: 0; border: 1px solid transparent; outline: none;
        }
        .search-input.active {
            width: 180px; opacity: 1; pointer-events: auto; padding: 0.25rem 1rem; border-color: var(--border-color);
        }
        
        .select-none { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- メインコンテンツ -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- 左ペイン: レコーダー -->
        <section class="w-full md:w-1/2 flex flex-col relative border-r border-theme transition-colors">
            
            <div class="flex-1 flex flex-col items-center justify-center p-8 mt-4">
                
                <!-- ファイル名入力 (中央揃え・下揃え・接近) -->
                <div class="flex justify-center w-full relative z-20" style="margin-top: 1.5rem; margin-bottom: 3rem;">
                    <div class="flex items-end justify-center" style="gap: 4px;">
                        <input type="text" id="filenameInput" value="マイ録音 1" class="filename-input font-medium tracking-wide text-center truncate" style="width: 180px; padding: 0; line-height: 1.2;" placeholder="ファイル名">
                        <span class="text-theme-muted text-lg font-light italic" style="line-height: 1.2; padding-bottom: 1px;">.webm</span>
                    </div>
                </div>

                <!-- 波形ビジュアライザー -->
                <div class="w-full max-w-md h-32 relative waveform-container mb-12">
                    <canvas id="visualizerCanvas" class="w-full h-full relative z-10 pointer-events-none"></canvas>
                </div>

                <!-- ステータス / タイマー -->
                <div class="text-theme-muted text-lg mb-12 h-16 flex flex-col items-center justify-center select-none">
                    <span id="recordStatusText" class="text-lg transition-colors">開始準備完了</span>
                    <span id="pauseStatusText" class="text-theme-muted text-sm mt-2 hidden">一時停止中</span>
                </div>

                <!-- 録音可能時間 (位置をさらに下に調整) -->
                <div id="storageEstimateText" class="text-xs text-theme-muted opacity-80" style="margin-top: 1.5rem; margin-bottom: -3.5rem;">残り録音可能時間：計算中...</div>
            </div>

            <!-- コントロールボタン -->
            <div class="h-32 flex items-center justify-center gap-12 pb-8">
                <!-- アイコンのズレを防ぐためSVG側に block m-auto を指定 -->
                <button id="btnRecord" class="w-16 h-16 bg-red-600 rounded-full flex items-center justify-center hover:bg-red-700 transition-all hover:scale-105 shadow-lg shadow-red-900/20 outline-none text-white text-3xl select-none">
                    <svg viewBox="0 0 24 24" class="w-[1em] h-[1em] block m-auto" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </button>

                <div id="recordingControls" class="hidden flex items-center justify-center gap-12 w-full">
                    <button id="btnCancel" class="w-12 h-12 flex items-center justify-center text-theme-muted hover:text-red-500 transition-colors outline-none text-3xl select-none" title="キャンセル">
                        <svg viewBox="0 0 24 24" class="w-[1em] h-[1em] block m-auto" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                    <button id="btnPauseResume" class="w-16 h-16 bg-red-600 rounded-full flex items-center justify-center text-white hover:bg-red-700 transition-colors shadow-lg shadow-red-900/20 outline-none text-3xl select-none" title="一時停止/再開">
                        <span id="iconPauseResume" class="flex items-center justify-center w-full h-full"><svg viewBox="0 0 24 24" class="w-[1em] h-[1em] block m-auto" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></span>
                    </button>
                    <button id="btnStop" class="w-12 h-12 flex items-center justify-center text-theme-muted hover:text-green-500 transition-colors outline-none text-3xl select-none" title="完了して保存">
                        <svg viewBox="0 0 24 24" class="w-[1em] h-[1em] block m-auto" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- 右ペイン: リストとプレイヤー -->
        <section class="w-full md:w-1/2 flex flex-col relative transition-colors duration-300">
            
            <!-- ヘッダー -->
            <header class="h-16 flex-shrink-0 flex items-center justify-end px-6 border-b border-theme relative z-30">
                <div class="flex items-center gap-2 text-theme-muted">
                    <div class="flex items-center">
                        <input type="text" id="searchInput" class="search-input text-sm" placeholder="名前で検索...">
                        <button id="btnSearch" class="p-2 hover:text-theme-accent transition-colors flex items-center justify-center outline-none select-none text-[28px]" title="検索">
                            <span class="flex items-center justify-center w-full h-full leading-none"><svg viewBox="0 0 24 24" class="w-[1em] h-[1em] block" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>

                    <!-- テーマを左側に (設定より前) -->
                    <button id="btnThemeToggle" class="p-2 hover:text-theme-accent transition-colors flex items-center justify-center relative outline-none select-none text-[28px]" title="テーマカラー変更">
                        <span class="flex items-center justify-center w-full h-full"><svg viewBox="0 0 24 24" class="w-[1em] h-[1em] block" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S15.67 9 16.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg></span>
                        <div id="themePalette" class="hidden absolute top-full right-0 mt-2 bg-theme-panel rounded-lg shadow-xl p-3 grid grid-cols-3 gap-2 border border-theme w-40">
                            <div class="w-8 h-8 rounded-full bg-[#11151c] border border-gray-600 cursor-pointer theme-color" data-color="black" title="Black (Dark)"></div>

                            <div class="w-8 h-8 rounded-full bg-pink-500 cursor-pointer theme-color" data-color="pink" title="Pink"></div>

    <script>
        // === SVGアイコン定義 ===
        const svgIcons = {
            mic: '<svg viewBox="0 0 24 24" class="w-[1em] h-[1em] block m-auto" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>',
            pause: '<svg viewBox="0 0 24 24" class="w-[1em] h-[1em] block m-auto" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>',
            play_arrow: '<svg viewBox="0 0 24 24" class="w-[1em] h-[1em] block m-auto" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
            more_vert: '<svg viewBox="0 0 24 24" class="w-[1em] h-[1em] block m-auto" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>'
        };

        document.addEventListener('DOMContentLoaded', () => {
            // ==========================================
            // テーマ管理
            // ==========================================
            const btnThemeToggle = document.getElementById('btnThemeToggle');
            const themePalette = document.getElementById('themePalette');
            const body = document.body;

            const savedTheme = localStorage.getItem('appTheme') || 'black';
            body.setAttribute('data-theme', savedTheme);

            btnThemeToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                const isHidden = themePalette.classList.contains('hidden');
                closeAllMenus();
                if (isHidden) themePalette.classList.remove('hidden');
            });

            document.querySelectorAll('.theme-color').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const color = e.target.dataset.color;
                    body.setAttribute('data-theme', color);
                    localStorage.setItem('appTheme', color); 
                    themePalette.classList.add('hidden');
                });
            });

            // ==========================================
            // ヘッダーメニュー管理
            // ==========================================
            const btnSearch = document.getElementById('btnSearch');
            const searchInput = document.getElementById('searchInput');
            const btnSort = document.getElementById('btnSort');
            const sortMenu = document.getElementById('sortMenu');
            const btnSettings = document.getElementById('btnSettings');
            const settingsMenu = document.getElementById('settingsMenu');

            function closeAllMenus() {
                themePalette.classList.add('hidden');
                sortMenu.classList.add('hidden');
                settingsMenu.classList.add('hidden');
                playerSettingsMenu.classList.add('hidden');
                document.querySelectorAll('.item-menu').forEach(m => m.classList.add('hidden'));
            }
            document.addEventListener('click', closeAllMenus);

            btnSearch.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                searchInput.classList.toggle('active');
                if (searchInput.classList.contains('active')) searchInput.focus();
                else {
                    searchInput.value = '';
                    renderList();
                }
            });

            searchInput.addEventListener('click', (e) => e.stopPropagation());
            searchInput.addEventListener('input', () => renderList());

            btnSort.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const isHidden = sortMenu.classList.contains('hidden');
                closeAllMenus();
                if (isHidden) sortMenu.classList.remove('hidden');
            });

            btnSettings.addEventListener('click', (e) => {
                e.stopPropagation();
                const isHidden = settingsMenu.classList.contains('hidden');
                closeAllMenus();
                if (isHidden) settingsMenu.classList.remove('hidden');
            });

            let currentAudioQuality = localStorage.getItem('audioQuality') || 'high'; 
            const qualityOptions = document.querySelectorAll('.quality-option');
            
            qualityOptions.forEach(opt => {
                const check = opt.querySelector('.check-icon');
                if(opt.dataset.quality === currentAudioQuality) check.classList.remove('hidden');
                else check.classList.add('hidden');
            });
            
            qualityOptions.forEach(option => {
                option.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentAudioQuality = option.dataset.quality;
                    localStorage.setItem('audioQuality', currentAudioQuality);
                    
                    qualityOptions.forEach(opt => {
                        const check = opt.querySelector('.check-icon');
                        if(opt.dataset.quality === currentAudioQuality) check.classList.remove('hidden');
                        else check.classList.add('hidden');
                    });
                    
                    settingsMenu.classList.add('hidden');
                    updateStorageEstimate();
                });
            });

            const storageEstimateText = document.getElementById('storageEstimateText');
            async function updateStorageEstimate() {
                try {
                    if (navigator.storage && navigator.storage.estimate) {
                        const estimate = await navigator.storage.estimate();
                        const availableBytes = estimate.quota - estimate.usage;
                        
                        let bitsPerSecond = 128000;
                        if (currentAudioQuality === 'high') bitsPerSecond = 256000;
                        else if (currentAudioQuality === 'low') bitsPerSecond = 64000;
                        
                        const bytesPerSecond = bitsPerSecond / 8;
                        const availableSeconds = availableBytes / bytesPerSecond;
                        
                        const hours = Math.floor(availableSeconds / 3600);
                        storageEstimateText.textContent = `残り録音可能時間：約${hours}h`;
                    } else {
                        storageEstimateText.textContent = '残り録音可能時間：不明';
                    }
                } catch (e) {
                    storageEstimateText.textContent = '残り録音可能時間：取得できません';
                }
            }
            updateStorageEstimate();

            // ==========================================
            // 波形ビジュアライザー
            // ==========================================
            const canvas = document.getElementById('visualizerCanvas');
            const canvasCtx = canvas.getContext('2d');
            let audioCtx, analyser, source, animationId;
            let isVisualizerActive = false;
            
            const HISTORY_SIZE = 350; 
            const volumeHistory = new Array(HISTORY_SIZE).fill(0);

            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                drawIdleWaveform();
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function drawIdleWaveform() {
                if(isVisualizerActive) return;
                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
                
                const centerY = canvas.height / 2;
                const computedStyle = getComputedStyle(document.body);
                const mutedColor = computedStyle.getPropertyValue('--text-muted').trim();
                canvasCtx.fillStyle = mutedColor;
                canvasCtx.globalAlpha = 0.3;
                
                const barWidth = canvas.width / HISTORY_SIZE;
                for(let i = 0; i < HISTORY_SIZE; i++) {
                    let x = i * barWidth;
                    canvasCtx.beginPath();
                    canvasCtx.arc(x + barWidth/2, centerY, 1, 0, Math.PI * 2);
                    canvasCtx.fill();
                }
                canvasCtx.globalAlpha = 1.0;
            }

            function startVisualizer(stream) {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                analyser = audioCtx.createAnalyser();
                source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                isVisualizerActive = true;
                volumeHistory.fill(0);

                let lastDrawTime = 0;

                function draw() {
                    if (!isVisualizerActive) return;
                    animationId = requestAnimationFrame(draw);
                    
                    const now = Date.now();
                    if (now - lastDrawTime < 30) return;
                    lastDrawTime = now;

                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for(let i=0; i<bufferLength; i++) sum += dataArray[i];
                    let avgVolume = sum / bufferLength;
                    
                    avgVolume = Math.min(255, avgVolume * 1.5);

                    volumeHistory.shift();
                    volumeHistory.push(avgVolume);

                    canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    const centerY = canvas.height / 2;
                    const barWidth = canvas.width / HISTORY_SIZE;
                    const computedStyle = getComputedStyle(document.body);
                    const accentColor = computedStyle.getPropertyValue('--accent').trim();

                    for(let i = 0; i < HISTORY_SIZE; i++) {
                        const vol = volumeHistory[i];
                        if (vol === 0) continue;

                        const barHeight = (vol / 255) * canvas.height;
                        const x = i * barWidth;
                        
                        canvasCtx.beginPath();
                        if (vol > 150) {
                            canvasCtx.strokeStyle = '#ef4444';
                            canvasCtx.globalAlpha = 0.8;
                        } else {
                            canvasCtx.strokeStyle = accentColor || '#3b82f6';
                            canvasCtx.globalAlpha = 0.5;
                        }
                        
                        canvasCtx.lineWidth = 0.8; 
                        canvasCtx.moveTo(x + barWidth/2, centerY - barHeight/2);
                        canvasCtx.lineTo(x + barWidth/2, centerY + barHeight/2);
                        canvasCtx.stroke();
                    }
                    canvasCtx.globalAlpha = 1.0;
                }
                draw();
            }

            function stopVisualizer() {
                isVisualizerActive = false;
                cancelAnimationFrame(animationId);
                drawIdleWaveform();
            }

            // ==========================================
            // 録音ロジック
            // ==========================================
            let mediaRecorder;
            let audioChunks = [];
            let stream;
            let timerInterval;
            let startTime = 0;
            let recordingTime = 0; // ms
            let isCancelled = false;

            const btnRecord = document.getElementById('btnRecord');
            const recordingControls = document.getElementById('recordingControls');
            const btnCancel = document.getElementById('btnCancel');
            const btnPauseResume = document.getElementById('btnPauseResume');
            const iconPauseResume = document.getElementById('iconPauseResume');
            const btnStop = document.getElementById('btnStop');
            const recordStatusText = document.getElementById('recordStatusText');
            const pauseStatusText = document.getElementById('pauseStatusText');
            const filenameInput = document.getElementById('filenameInput');

            function formatTime(ms) {
                const totalSeconds = Math.floor(ms / 1000);
                const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
                const s = String(totalSeconds % 60).padStart(2, '0');
                return `${m}:${s}`;
            }

            function updateStatusDisplay() {
                recordStatusText.textContent = formatTime(recordingTime);
                recordStatusText.className = 'text-4xl font-light tracking-wider text-theme-accent transition-colors';
            }

            function resetStatusDisplay() {
                recordStatusText.textContent = '開始準備完了';
                recordStatusText.className = 'text-theme-muted text-lg transition-colors';
                pauseStatusText.classList.add('hidden');
            }

            btnRecord.addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    isCancelled = false;
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    const options = { mimeType: 'audio/webm' };
                    if (currentAudioQuality === 'high') options.audioBitsPerSecond = 256000;
                    else if (currentAudioQuality === 'low') options.audioBitsPerSecond = 64000;
                    else options.audioBitsPerSecond = 128000; 
                    
                    mediaRecorder = new MediaRecorder(stream, MediaRecorder.isTypeSupported(options.mimeType) ? options : undefined);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => {
                        if (e.data.size > 0) audioChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        if (!isCancelled && audioChunks.length > 0) {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                            saveRecording(audioBlob, recordingTime);
                        }
                        
                        if (stream) stream.getTracks().forEach(track => track.stop());
                        stopVisualizer();
                        clearInterval(timerInterval);
                        
                        btnRecord.classList.remove('hidden');
                        recordingControls.classList.add('hidden');
                        resetStatusDisplay();
                        
                        if (!isCancelled) {
                            const currentName = filenameInput.value;
                            const match = currentName.match(/(.*?)(\d+)$/);
                            if (match) filenameInput.value = match[1] + (parseInt(match[2]) + 1);
                        }
                        updateStorageEstimate();
                    };

                    mediaRecorder.start(200);
                    startVisualizer(stream);
                    
                    btnRecord.classList.add('hidden');
                    recordingControls.classList.remove('hidden');
                    iconPauseResume.innerHTML = svgIcons.pause;
                    
                    recordingTime = 0;
                    startTime = Date.now();
                    updateStatusDisplay();
                    timerInterval = setInterval(() => {
                        recordingTime = Date.now() - startTime;
                        updateStatusDisplay();
                    }, 100);

                } catch (err) {
                    alert("マイクへのアクセスが拒否されたか、エラーが発生しました。");
                }
            });

            btnPauseResume.addEventListener('click', (e) => {
                e.preventDefault();
                if (mediaRecorder.state === 'recording') {
                    mediaRecorder.pause();
                    iconPauseResume.innerHTML = svgIcons.mic;
                    clearInterval(timerInterval);
                    isVisualizerActive = false;
                    pauseStatusText.classList.remove('hidden');
                    recordStatusText.classList.remove('text-theme-accent');
                    recordStatusText.classList.add('text-theme-muted');
                } else if (mediaRecorder.state === 'paused') {
                    mediaRecorder.resume();
                    iconPauseResume.innerHTML = svgIcons.pause;
                    isVisualizerActive = true;
                    startVisualizer(stream); 
                    
                    startTime = Date.now() - recordingTime; 
                    pauseStatusText.classList.add('hidden');
                    recordStatusText.classList.remove('text-theme-muted');
                    recordStatusText.classList.add('text-theme-accent');

                    timerInterval = setInterval(() => {
                        recordingTime = Date.now() - startTime;
                        updateStatusDisplay();
                    }, 100);
                }
            });

            btnCancel.addEventListener('click', (e) => {
                e.preventDefault();
                isCancelled = true;
                if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            });

            btnStop.addEventListener('click', (e) => {
                e.preventDefault();
                if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            });

            // ==========================================
            // リストデータ管理と描画
            // ==========================================
            let recordings = []; 
            const recordingsList = document.getElementById('recordingsList');
            const emptyMessage = document.getElementById('emptyMessage');
            let currentSort = 'date'; 

            document.querySelectorAll('.sort-option').forEach(el => {
                el.addEventListener('click', (e) => {
                    currentSort = e.target.dataset.sort;
                    renderList();
                });
            });

            function saveRecording(blob, finalDurationMs) {
                const url = URL.createObjectURL(blob);
                let name = filenameInput.value.trim() || '名称未設定';
                const now = new Date();
                const dateStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                
                recordings.unshift({
                    id: Date.now(),
                    name: name,
                    url: url,
                    dateStr: dateStr,
                    durationMs: finalDurationMs,
                    durationStr: formatTime(finalDurationMs),
                    blob: blob,
                    timestamp: now.getTime()
                });
                renderList();
            }

            let currentActiveId = null;
            let itemToRename = null;
            let itemToDelete = null;

            const renameModal = document.getElementById('renameModal');
            const renameInput = document.getElementById('renameInput');
            const btnRenameCancel = document.getElementById('btnRenameCancel');
            const btnRenameSave = document.getElementById('btnRenameSave');
            
            const deleteConfirmModal = document.getElementById('deleteConfirmModal');
            const btnDeleteCancel = document.getElementById('btnDeleteCancel');
            const btnDeleteConfirm = document.getElementById('btnDeleteConfirm');

            function closeRenameModal() {
                renameModal.classList.add('hidden');
                itemToRename = null;
            }

            btnRenameCancel.addEventListener('click', closeRenameModal);
            btnRenameSave.addEventListener('click', () => {
                if (itemToRename && renameInput.value.trim() !== '') {
                    itemToRename.name = renameInput.value.trim();
                    renderList();
                }
                closeRenameModal();
            });

            btnDeleteCancel.addEventListener('click', () => {
                deleteConfirmModal.classList.add('hidden');
                itemToDelete = null;
            });

            btnDeleteConfirm.addEventListener('click', () => {
                if (itemToDelete) {
                    recordings = recordings.filter(r => r.id !== itemToDelete.id);
                    if (currentActiveId === itemToDelete.id) {
                        document.getElementById('playerPanel').classList.add('opacity-50', 'pointer-events-none');
                        document.getElementById('audioElement').pause();
                        currentActiveId = null;
                    }
                    renderList();
                }
                deleteConfirmModal.classList.add('hidden');
                itemToDelete = null;
            });

            function renderList() {
                recordingsList.innerHTML = '';
                const query = searchInput.value.toLowerCase();
                
                let filtered = recordings.filter(r => r.name.toLowerCase().includes(query));
                
                filtered.sort((a, b) => {
                    if (currentSort === 'name') return a.name.localeCompare(b.name);
                    return b.timestamp - a.timestamp;
                });

                if (filtered.length === 0) {
                    emptyMessage.style.display = 'flex';
                } else {
                    emptyMessage.style.display = 'none';
                    filtered.forEach(rec => {
                        const item = document.createElement('div');
                        item.className = `recording-item p-4 border-b border-theme cursor-pointer transition-colors relative ${rec.id === currentActiveId ? 'active' : ''}`;
                        // 「⋮」ボタンとそのメニューを同じrelative階層内に配置し、確実な位置表示・トグル開閉を行う
                        item.innerHTML = `
                            <div class="flex items-center justify-between w-full">
                                <div class="overflow-hidden flex-1 pr-4">
                                    <div class="text-[15px] font-medium truncate filename-display select-none">${rec.name}.webm</div>
                                    <div class="text-xs text-theme-muted mt-1 flex gap-3 select-none">
                                        <span>${rec.dateStr}</span><span>${rec.durationStr}</span>
                                    </div>
                                </div>
                                <div class="relative flex-shrink-0">
                                    <button class="menu-btn w-10 h-10 rounded-full flex items-center justify-center hover:bg-black/10 transition-colors text-theme-muted hover:text-main outline-none text-[28px]" onclick="event.stopPropagation()">
                                        <span class="select-none flex items-center justify-center w-full h-full">${svgIcons.more_vert}</span>
                                    </button>
                                    <div class="item-menu hidden absolute right-0 top-full mt-1 bg-theme-panel rounded-md shadow-xl py-2 z-50 border border-theme min-w-[140px] text-sm text-left cursor-default" onclick="event.stopPropagation()">
                                        <button class="w-full text-left px-4 py-2 hover:bg-black/10 transition-colors btn-rename select-none outline-none text-main">名前を変更</button>
                                        <a href="${rec.url}" download="${rec.name}.webm" class="block w-full text-left px-4 py-2 hover:bg-black/10 transition-colors select-none outline-none text-main" style="text-decoration: none;">ダウンロード</a>
                                        <button class="w-full text-left px-4 py-2 hover:bg-black/10 transition-colors btn-delete select-none outline-none text-main">削除</button>
                                    </div>
                                </div>
                            </div>
                        `;

                        item.addEventListener('click', () => {
                            currentActiveId = rec.id;
                            renderList(); 
                            loadPlayer(rec);
                        });

                        const menuBtn = item.querySelector('.menu-btn');
                        const itemMenu = item.querySelector('.item-menu');
                        menuBtn.addEventListener('click', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            const isHidden = itemMenu.classList.contains('hidden');
                            closeAllMenus();
                            if (isHidden) itemMenu.classList.remove('hidden');
                        });

                        item.querySelector('.btn-delete').addEventListener('click', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            itemMenu.classList.add('hidden');
                            itemToDelete = rec;
                            deleteConfirmModal.classList.remove('hidden');
                        });

                        item.querySelector('.btn-rename').addEventListener('click', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            itemMenu.classList.add('hidden');
                            itemToRename = rec;
                            renameInput.value = rec.name;
                            renameModal.classList.remove('hidden');
                            renameInput.focus();
                        });

                        recordingsList.appendChild(item);
                    });
                }
            }

            // ==========================================
            // プレイヤーロジック
            // ==========================================
            const playerPanel = document.getElementById('playerPanel');
            const audioEl = document.getElementById('audioElement');
            const btnPlayPause = document.getElementById('btnPlayPause');
            const playIcon = document.getElementById('playIcon');
            const seekSlider = document.getElementById('seekSlider');
            const currentTimeDisplay = document.getElementById('currentTimeDisplay');
            const durationDisplay = document.getElementById('durationDisplay');
            
            const btnPlayerMenu = document.getElementById('btnPlayerMenu');
            const playerSettingsMenu = document.getElementById('playerSettingsMenu');
            const menuRewind = document.getElementById('menuRewind');
            const menuForward = document.getElementById('menuForward');
            const menuLoop = document.getElementById('menuLoop');
            const menuSkipSilence = document.getElementById('menuSkipSilence');
            const iconLoopCheck = document.getElementById('iconLoopCheck');
            const iconSkipCheck = document.getElementById('iconSkipCheck');
            const btnSpeed = document.getElementById('btnSpeed');

            let isSkipSilenceActive = false;
            let silenceCheckInterval;
            let playAudioCtx, playAnalyser, playSource;

            function loadPlayer(rec) {
                audioEl.src = rec.url;
                
                playerPanel.classList.remove('opacity-50', 'pointer-events-none');
                playIcon.innerHTML = svgIcons.play_arrow;
                seekSlider.value = 0;
                currentTimeDisplay.textContent = '00:00';
                
                const knownDurationSec = rec.durationMs / 1000;
                seekSlider.max = knownDurationSec;
                durationDisplay.textContent = rec.durationStr;
                
                audioEl.addEventListener('loadedmetadata', function onMeta() {
                    if (audioEl.duration === Infinity) {
                        audioEl.currentTime = 1e101; 
                        audioEl.addEventListener('timeupdate', function onTime() {
                            audioEl.removeEventListener('timeupdate', onTime);
                            audioEl.currentTime = 0; 
                        });
                    }
                }, {once: true});

                initPlayAnalyser();
            }

            function initPlayAnalyser() {
                if(!playAudioCtx) {
                    playAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    playSource = playAudioCtx.createMediaElementSource(audioEl);
                    playAnalyser = playAudioCtx.createAnalyser();
                    playSource.connect(playAnalyser);
                    playAnalyser.connect(playAudioCtx.destination);
                    playAnalyser.fftSize = 256;
                }
            }

            function togglePlay(e) {
                if (e) e.preventDefault();
                if (!audioEl.src) return;
                if (audioEl.paused) {
                    if (playAudioCtx && playAudioCtx.state === 'suspended') playAudioCtx.resume();
                    audioEl.play();
                    playIcon.innerHTML = svgIcons.pause;
                    startSilenceSkipPoller();
                } else {
                    audioEl.pause();
                    playIcon.innerHTML = svgIcons.play_arrow;
                    stopSilenceSkipPoller();
                }
            }

            btnPlayPause.addEventListener('click', togglePlay);

            audioEl.addEventListener('timeupdate', () => {
                if (!audioEl.paused) {
                    seekSlider.value = audioEl.currentTime;
                    currentTimeDisplay.textContent = formatTime(audioEl.currentTime * 1000);
                }
            });

            audioEl.addEventListener('ended', () => {
                if(!audioEl.loop) {
                    playIcon.innerHTML = svgIcons.play_arrow;
                    seekSlider.value = 0;
                    currentTimeDisplay.textContent = '00:00';
                    stopSilenceSkipPoller();
                }
            });

            seekSlider.addEventListener('input', () => {
                currentTimeDisplay.textContent = formatTime(seekSlider.value * 1000);
            });
            seekSlider.addEventListener('change', () => {
                audioEl.currentTime = seekSlider.value;
            });

            document.getElementById('btnReplay5').addEventListener('click', (e) => { e.preventDefault(); audioEl.currentTime = Math.max(0, audioEl.currentTime - 5); });
            document.getElementById('btnForward5').addEventListener('click', (e) => { e.preventDefault(); audioEl.currentTime = Math.min(seekSlider.max, audioEl.currentTime + 5); });

            btnPlayerMenu.addEventListener('click', (e) => {
                e.preventDefault(); 
                e.stopPropagation();
                const isHidden = playerSettingsMenu.classList.contains('hidden');
                closeAllMenus();
                if (isHidden) playerSettingsMenu.classList.remove('hidden');
            });

            menuRewind.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); audioEl.currentTime = Math.max(0, audioEl.currentTime - 5); playerSettingsMenu.classList.add('hidden'); });
            menuForward.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); audioEl.currentTime = Math.min(seekSlider.max, audioEl.currentTime + 5); playerSettingsMenu.classList.add('hidden'); });
            
            menuLoop.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                audioEl.loop = !audioEl.loop;
                if(audioEl.loop) iconLoopCheck.classList.remove('hidden');
                else iconLoopCheck.classList.add('hidden');
                playerSettingsMenu.classList.add('hidden');
            });

            menuSkipSilence.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                isSkipSilenceActive = !isSkipSilenceActive;
                if(isSkipSilenceActive) {
                    iconSkipCheck.classList.remove('hidden');
                    if(!audioEl.paused) startSilenceSkipPoller();
                } else {
                    iconSkipCheck.classList.add('hidden');
                    stopSilenceSkipPoller();
                }
                playerSettingsMenu.classList.add('hidden');
            });

            const speeds = [1.0, 1.5, 2.0, 0.5];
            let speedIdx = 0;
            btnSpeed.addEventListener('click', (e) => {
                e.preventDefault();
                speedIdx = (speedIdx + 1) % speeds.length;
                audioEl.playbackRate = speeds[speedIdx];
                btnSpeed.textContent = speeds[speedIdx] + 'x';
            });

            function startSilenceSkipPoller() {
                if(!isSkipSilenceActive || !playAnalyser) return;
                if(silenceCheckInterval) clearInterval(silenceCheckInterval);
                
                const bufferLength = playAnalyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                
                silenceCheckInterval = setInterval(() => {
                    if(audioEl.paused) return;
                    playAnalyser.getByteFrequencyData(dataArray);
                    let maxVol = 0;
                    for(let i=0; i<bufferLength; i++) if(dataArray[i] > maxVol) maxVol = dataArray[i];
                    
                    if(maxVol < 10) {
                        if(audioEl.currentTime + 0.2 < seekSlider.max) {
                            audioEl.currentTime += 0.2;
                            seekSlider.value = audioEl.currentTime;
                        }
                    }
                }, 100);
            }

            function stopSilenceSkipPoller() {
                if(silenceCheckInterval) clearInterval(silenceCheckInterval);
            }
        });
    </script>
    <!-- オフライン実行＆PWAインストーラ対応用Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        const swCode = `
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => clients.claim());
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
        `;
        const swBlob = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
      }
    </script>
</body>
</html>
